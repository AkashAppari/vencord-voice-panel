name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: test/pnpm-lock.yaml

      # The harness bundles index.tsx with esbuild itself, then renders it in jsdom.
      - name: Run the harness
        working-directory: test
        run: |
          pnpm install --frozen-lockfile
          node harness.mjs
